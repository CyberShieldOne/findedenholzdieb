# Official pnpm audit checks known advisories in the committed lockfile.
# https://pnpm.io/cli/audit (accessed 2026-11-16)
name: Security - pnpm dependency audit
on:
  pull_request:
    paths: ["package.json", "pnpm-lock.yaml", ".github/workflows/security-pnpm-audit.yml"]
  push:
    branches: [main]
    paths: ["package.json", "pnpm-lock.yaml", ".github/workflows/security-pnpm-audit.yml"]
  schedule:
    - cron: "15 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4, existing verified pin from MaverickApp
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Audit pinned dependency tree
        run: pnpm audit --audit-level=high
